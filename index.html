<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIVATE IT NODE // WEB RADIO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 5; }
        
        #ui { position: relative; z-index: 10; text-align: center; padding: 10px; background: rgba(0,0,0,0.9); border-bottom: 2px solid #00ff41; }
        #score-val { font-size: 42px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ff41; }
        
        #radio-status { font-size: 10px; color: #ffcc00; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .live-indicator { display: inline-block; width: 8px; height: 8px; background: red; border-radius: 50%; margin-right: 5px; animation: blink 1s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        #start-prompt { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; text-align: center; background: #00ff41; color: #000;
            padding: 20px 40px; font-weight: bold; font-size: 20px; cursor: pointer;
            box-shadow: 0 0 30px #00ff41; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }
    </style>
</head>
<body>
    <div id="start-prompt">ПОДКЛЮЧИТЬСЯ К ЭФИРУ</div>
    
    <div id="ui">
        <div>NODES_CLEARED: <span id="score-val">0</span></div>
        <div id="radio-status"><span class="live-indicator"></span>LIVE_PHONK_STATION</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Прямая ссылка на поток Phonk радио
    const radioStream = new Audio("https://shoutcast.com.ru:8000/phonk");
    radioStream.crossOrigin = "anonymous";

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let objects = [];
    let texts = [];
    let gameActive = false;

    document.getElementById('start-prompt').addEventListener('click', function() {
        gameActive = true;
        this.style.display = 'none';
        
        // Запуск потока
        radioStream.play().catch(error => {
            console.log("Ошибка стрима:", error);
            alert("Ошибка подключения к радио. Попробуй еще раз.");
        });
    });

    class FloatingText {
        constructor(x, y, text) {
            this.x = x; this.y = y; this.text = text; this.life = 1.0;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.life;
            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px Courier New";
            ctx.fillText(this.text, this.x, this.y);
            this.y -= 1.5; this.life -= 0.02;
            ctx.restore();
        }
    }

    function handleInput(ex, ey) {
        if (!gameActive) return;
        objects.forEach((obj, i) => {
            let dx = ex - (obj.x + 25);
            let dy = ey - (obj.y + 25);
            if (Math.abs(dx) < 45 && Math.abs(dy) < 45) {
                score++;
                texts.push(new FloatingText(obj.x, obj.y, "NODE_DELETED"));
                objects.splice(i, 1);
                document.getElementById('score-val').innerText = score;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        });
    }

    window.addEventListener('touchmove', (e) => {
        handleInput(e.touches[0].clientX, e.touches[0].clientY);
    });

    function gameLoop() {
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        if (gameActive) {
            // Спавн узлов
            if (Math.random() < 0.06) {
                objects.push({
                    x: Math.random() * (canvas.width - 50),
                    y: canvas.height + 50,
                    sy: -14 - Math.random() * 5,
                    sx: (Math.random() - 0.5) * 6
                });
            }
            
            objects.forEach((obj, i) => {
                obj.y += obj.sy; 
                obj.x += obj.sx; 
                obj.sy += 0.35; // Гравитация
                
                ctx.strokeStyle = "#00ff41";
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#00ff41";
                ctx.strokeRect(obj.x, obj.y, 50, 50);
                
                if (obj.y > canvas.height + 100) objects.splice(i, 1);
            });
            
            texts.forEach((t, i) => {
                t.draw();
                if (t.life <= 0) texts.splice(i, 1);
            });
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
