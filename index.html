<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIVATE IT NODE // ELITE SLICER v2.1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; touch-action: none; }
        
        /* Твой фон из GitHub */
        #bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('IMG_2080.png') no-repeat center center;
            background-size: cover; z-index: 1; opacity: 0.5;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none; }

        /* Интерфейс как на скриншоте */
        #ui-header {
            position: relative; z-index: 10; padding: 15px;
            background: rgba(0, 0, 0, 0.85); border-bottom: 2px solid #33ff33;
        }
        .header-top { display: flex; justify-content: space-between; font-size: 14px; color: #33ff33; margin-bottom: 5px; font-weight: bold; }
        .stats-main { display: flex; justify-content: space-between; align-items: flex-end; }
        #score-val { font-size: 48px; font-weight: bold; color: #fff; line-height: 1; text-shadow: 0 0 15px rgba(255,255,255,0.5); }
        #best-val { font-size: 14px; color: #ffcc00; margin-top: 5px; }
        
        .progress-box { text-align: right; }
        .lvl-status { font-size: 11px; margin-bottom: 4px; letter-spacing: 1px; }
        .bar-bg { width: 140px; height: 14px; background: #052b05; border: 1px solid #33ff33; border-radius: 2px; position: relative; }
        #bar-fill { width: 40%; height: 100%; background: #33ff33; box-shadow: 0 0 15px #33ff33; transition: width 0.3s; }
        
        #recording-status { text-align: center; color: #ff3333; font-size: 12px; margin-top: 10px; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        /* Мониторы дешифровки */
        #ui-footer {
            position: absolute; bottom: 90px; width: 100%;
            display: flex; justify-content: space-around; z-index: 10; padding: 0 10px; box-sizing: border-box;
        }
        .monitor {
            width: 47%; background: rgba(0, 15, 0, 0.8);
            border: 1px solid rgba(51, 255, 51, 0.5); border-radius: 5px; padding: 8px;
            font-size: 9px; color: #00ff41; height: 90px; overflow: hidden; line-height: 1.2;
        }

        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; background: #33ff33; color: #000; border: none;
            padding: 15px 30px; font-family: 'Courier New', monospace; font-weight: bold; 
            cursor: pointer; box-shadow: 0 0 30px #33ff33; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <button id="start-btn">ACCESS GRANTED: INITIALIZE</button>

    <div id="ui-header">
        <div class="header-top">
            <span>PRIVATE IT NODE // ELITE SLICER</span>
            <span>v2.1</span>
        </div>
        <div class="stats-main">
            <div>
                <div style="font-size: 9px; opacity: 0.8;">DATA_UNITS CLEARED</div>
                <div id="score-val">0</div>
                <div id="best-val">BEST: 18,200</div>
            </div>
            <div class="progress-box">
                <div class="lvl-status">LVL <span id="lvl-num">3</span> // STATUS: <span style="color:#0f0">ACTIVE</span></div>
                <div class="bar-bg"><div id="bar-fill"></div></div>
            </div>
        </div>
        <div id="recording-status">● RECORD PHONK LIVE</div>
    </div>

    <div id="ui-footer">
        <div class="monitor">
            [SYSTEM_MONITOR]<br>
            <div id="log-1">INITIALIZING...</div>
        </div>
        <div class="monitor">
            [SYSTEM_MONITOR]<br>
            <div id="log-2">SCANNING_NODES...</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0, level = 3, exp = 40, gameActive = false;
    let objects = [], trail = [];

    const audio = new Audio("music.mp3");
    audio.loop = true;

    document.getElementById('start-btn').onclick = () => {
        gameActive = true;
        document.getElementById('start-btn').style.display = 'none';
        audio.play();
        startLogs();
    };

    class DataNode {
        constructor() {
            this.size = 55;
            this.x = 50 + Math.random() * (canvas.width - 100);
            this.y = canvas.height + 50;
            this.sy = -(13 + Math.random() * 4);
            this.sx = (Math.random() - 0.5) * 5;
            this.rot = 0;
            this.rotV = (Math.random() - 0.5) * 0.1;
        }
        update() {
            this.x += this.sx; this.sy += 0.32; this.y += this.sy; this.rot += this.rotV;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rot);
            
            // Основной контур
            ctx.strokeStyle = "#33ff33";
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#33ff33";
            ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
            
            // Внутренние "схемы"
            ctx.shadowBlur = 0;
            ctx.strokeStyle = "rgba(51, 255, 51, 0.4)";
            ctx.lineWidth = 1;
            for(let i = -this.size/2 + 10; i < this.size/2; i += 15) {
                ctx.beginPath(); ctx.moveTo(i, -this.size/2); ctx.lineTo(i, this.size/2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-this.size/2, i); ctx.lineTo(this.size/2, i); ctx.stroke();
            }
            ctx.restore();
        }
    }

    function handleInput(x, y) {
        if(!gameActive) return;
        trail.push({x, y, life: 1});
        if(trail.length > 15) trail.shift();

        objects.forEach((obj, i) => {
            let dx = x - obj.x;
            let dy = y - obj.y;
            if(Math.sqrt(dx*dx + dy*dy) < 45) {
                score += 150; 
                exp += 2;
                objects.splice(i, 1);
                updateUI();
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        });
    }

    function updateUI() {
        document.getElementById('score-val').innerText = score.toLocaleString();
        document.getElementById('bar-fill').style.width = exp + "%";
        if(exp >= 100) { level++; exp = 0; document.getElementById('lvl-num').innerText = level; }
    }

    function startLogs() {
        const lines1 = ["DECRYPTING_NODE_0xFF", "STREAM_PIPE_OPEN", "RECOVERY_MODE: ON", "BYPASSING_SSL..."];
        const lines2 = ["ANALYZING_PACKET_34", "UPLINK_STABLE", "BITRATE_OPTIMIZED", "LATENCY: 12ms"];
        setInterval(() => {
            document.getElementById('log-1').innerHTML = lines1[Math.floor(Math.random()*lines1.length)] + "<br>" + document.getElementById('log-1').innerHTML.slice(0, 100);
            document.getElementById('log-2').innerHTML = lines2[Math.floor(Math.random()*lines2.length)] + "<br>" + document.getElementById('log-2').innerHTML.slice(0, 100);
        }, 800);
    }

    window.addEventListener('touchmove', (e) => {
        e.preventDefault();
        handleInput(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: false});

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if(gameActive) {
            // Эффект лазерного меча (как на IMG_114)
            if(trail.length > 1) {
                ctx.save();
                ctx.shadowBlur = 15; ctx.shadowColor = "#00ffff";
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
                ctx.lineCap = "round"; ctx.lineJoin = "round";
                ctx.beginPath(); ctx.moveTo(trail[0].x, trail[0].y);
                for(let i=1; i<trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
                ctx.stroke();
                ctx.restore();
                trail.forEach(t => t.life -= 0.05);
                trail = trail.filter(t => t.life > 0);
            }

            if(Math.random() < 0.04) objects.push(new DataNode());
            objects.forEach((obj, i) => { 
                obj.update(); 
                obj.draw(); 
                if(obj.y > canvas.height + 100) objects.splice(i, 1); 
            });
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
