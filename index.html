<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NET_OPTIMIZER v5.5</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; background: #000; color: #00ff41; 
            font-family: 'Courier New', monospace; overflow: hidden; 
            height: 100vh; touch-action: none; user-select: none;
        }
        #bg-container { 
            position: fixed; inset: 0; 
            background: linear-gradient(135deg, #011104 0%, #000000 100%); 
            z-index: 0; 
        }
        canvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        
        /* UI */
        #ui-header { position: relative; z-index: 50; padding: 20px; display: flex; justify-content: space-between; box-sizing: border-box; width: 100%; }
        #score-val { font-size: 45px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #00ff41; line-height: 1; }
        .hp-container { display: flex; gap: 8px; margin-top: 8px; }
        .hp-dot { width: 12px; height: 12px; background: #00f2ff; box-shadow: 0 0 8px #00f2ff; }
        .hp-dot.lost { background: transparent; border: 1px solid #ff003c; box-shadow: none; opacity: 0.3; }

        /* Модальные окна */
        .modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-main { background: transparent; color: #00ff41; border: 2px solid #00ff41; padding: 12px 35px; font-size: 16px; font-weight: bold; font-family: 'Courier New', monospace; cursor: pointer; }
        .btn-main:hover { background: #00ff41; color: #000; }
    </style>
</head>
<body>

    <div id="bg-container"></div>

    <!-- Старт -->
    <div id="start-screen" class="modal">
        <h1 style="color: #fff; font-size: 28px; margin-bottom: 5px;">NET_OPTIMIZER v5.5</h1>
        <p style="color: #00f2ff; margin-bottom: 25px; font-size: 12px;">CORE_DIAGNOSTIC: READY</p>
        <button id="start-btn" class="btn-main">INITIALIZE</button>
    </div>

    <!-- Смерть -->
    <div id="death-screen" class="modal" style="display: none;">
        <h1 style="color: #ff003c; font-size: 26px;">DIAGNOSTIC_OVERFLOW</h1>
        <div id="final-stats" style="margin: 20px 0; color: #fff; font-size: 14px; line-height: 1.6;"></div>
        <button id="restart-btn" class="btn-main">REBOOT CORE</button>
    </div>

    <div id="ui-header">
        <div>
            <div id="score-val">0</div>
            <div id="hp-box" class="hp-container">
                <div class="hp-dot" id="hp1"></div><div class="hp-dot" id="hp2"></div><div class="hp-dot" id="hp3"></div>
            </div>
            <div id="speed-ui" style="font-size: 11px; color: #aaa; margin-top: 4px;">LOAD: 1.0x</div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 10px; color: #aaa;">MULTIPLIER</div>
            <div id="combo-ui" style="font-size: 28px; color: #ffcc00; font-weight: bold;">X1</div>
            <div id="freeze-ui" style="font-size: 11px; color: #00f2ff; display: none; font-weight: bold; margin-top: 5px;">BUFFER_DELAY</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    // Мягкая инициализация TG
    var tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg && tg.ready) { tg.ready(); tg.expand(); }

    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');

    var score = 0, hp = 3, combo = 1, gameActive = false, maxCombo = 1, gameSpeed = 1.0;
    var objects = [], trail = [], particles = [], floatingTexts = [];
    var freezeTimer = 0;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Конструктор объектов через функцию (работает на старых движках лучше классов)
    function NetworkNode() {
        this.size = 40;
        this.x = Math.random() * (canvas.width - 80) + 40;
        this.y = canvas.height + 40;
        
        var baseForce = 11 + Math.random() * 4 + (gameSpeed * 1.2);
        this.sy = -baseForce;
        this.sx = (Math.random() - 0.5) * 4;
        
        this.angle = Math.random() * 3.14;
        this.rotationSpeed = (Math.random() - 0.5) * 0.05;
        this.history = [];

        var r = Math.random();
        if (r < 0.15) { 
            this.type = 'err'; 
            this.color = '#ff003c'; // Красный (спам)
        } else if (r > 0.90) { 
            this.type = 'gold'; 
            this.color = '#ffcc00'; // Золотой (супер)
        } else if (r > 0.80 && r <= 0.90) {
            this.type = 'freeze'; 
            this.color = '#00f2ff'; // Синий (заморозка)
        } else { 
            this.type = 'data'; 
            this.color = '#00ff41'; // Зеленый (стандарт)
        }
    }

    function takeDamage() {
        hp--;
        if (hp == 2) document.getElementById('hp3').classList.add('lost');
        if (hp == 1) document.getElementById('hp2').classList.add('lost');
        if (hp == 0) {
            document.getElementById('hp1').classList.add('lost');
            endGame();
        }
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

    function handleInput(x, y) {
        if (!gameActive) return;
        trail.push({x: x, y: y, life: 1.0});

        for (var i = objects.length - 1; i >= 0; i--) {
            var obj = objects[i];
            var dist = Math.sqrt(Math.pow(x - obj.x, 2) + Math.pow(y - obj.y, 2));
            
            if (dist < 45) {
                // Искры
                for (var p = 0; p < 12; p++) {
                    particles.push({
                        x: obj.x, y: obj.y,
                        sx: (Math.random() - 0.5) * 10,
                        sy: (Math.random() - 0.5) * 10,
                        life: 1.0,
                        color: obj.color
                    });
                }

                if (obj.type === 'err') {
                    combo = 1;
                    freezeTimer = 0;
                    takeDamage();
                } else if (obj.type === 'freeze') {
                    freezeTimer = 200; // заморозка
                    score += 100 * combo;
                    floatingTexts.push({x: obj.x, y: obj.y, text: "FREEZE", color: obj.color, life: 1.0});
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
                } else {
                    var pts = (obj.type === 'gold' ? 300 : 100) * combo;
                    score += pts;
                    if (combo > maxCombo) maxCombo = combo;
                    combo++;

                    gameSpeed = 1.0 + Math.floor(score / 500) * 0.1;
                    if (gameSpeed > 2.2) gameSpeed = 2.2;

                    floatingTexts.push({x: obj.x, y: obj.y, text: "+" + pts, color: obj.color, life: 1.0});
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                }
                objects.splice(i, 1);
                updateUI();
            }
        }
    }

    function updateUI() {
        document.getElementById('score-val').innerText = score;
        document.getElementById('combo-ui').innerText = "X" + combo;
        document.getElementById('speed-ui').innerText = "LOAD: " + gameSpeed.toFixed(1) + "x";
        document.getElementById('freeze-ui').style.display = freezeTimer > 0 ? 'block' : 'none';
    }

    function endGame() {
        gameActive = false;
        document.getElementById('death-screen').style.display = 'flex';
        document.getElementById('final-stats').innerHTML = 
            "SCORE: " + score + " Pts<br>MAX COMBO: X" + maxCombo;
    }

    function resetGame() {
        score = 0; hp = 3; combo = 1; gameSpeed = 1.0; freezeTimer = 0;
        objects = []; particles = []; trail = []; floatingTexts = [];
        document.getElementById('hp1').classList.remove('lost');
        document.getElementById('hp2').classList.remove('lost');
        document.getElementById('hp3').classList.remove('lost');
        document.getElementById('death-screen').style.display = 'none';
        updateUI();
        gameActive = true;
    }

    document.getElementById('start-btn').onclick = function() {
        document.getElementById('start-screen').style.display = 'none';
        gameActive = true;
    };

    document.getElementById('restart-btn').onclick = resetGame;

    // Ввод пальца (универсальный)
    window.addEventListener('touchstart', function(e) {
        if(e.touches.length > 0) handleInput(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: true});
    
    window.addEventListener('touchmove', function(e) {
        if(e.touches.length > 0) handleInput(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: true});

    // Основной цикл игры
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (freezeTimer > 0) {
            freezeTimer--;
            if (freezeTimer == 0) updateUI();
        }

        if (gameActive) {
            // След пальца
            if (trail.length > 1) {
                for (var i = 1; i < trail.length; i++) {
                    ctx.beginPath();
                    ctx.strokeStyle = "rgba(255,255,255," + trail[i].life + ")";
                    ctx.lineWidth = 4 * trail[i].life;
                    ctx.moveTo(trail[i-1].x, trail[i-1].y);
                    ctx.lineTo(trail[i].x, trail[i].y);
                    ctx.stroke();
                }
                for(var t=0; t<trail.length; t++) { trail[t].life -= 0.05; }
                trail = trail.filter(function(t) { return t.life > 0; });
            }

            // Спавн
            var spawnChance = freezeTimer > 0 ? 0.01 : (0.03 * gameSpeed);
            if (Math.random() < spawnChance && objects.length < 4) {
                objects.push(new NetworkNode());
            }

            // Движение кубов
            var currentMod = freezeTimer > 0 ? 0.3 : 1.0;
            for (var i = objects.length - 1; i >= 0; i--) {
                var obj = objects[i];
                obj.x += obj.sx * currentMod;
                obj.sy += 0.3 * currentMod;
                obj.y += obj.sy * currentMod;
                obj.angle += obj.rotationSpeed * currentMod;

                // Отрисовка куба
                ctx.save();
                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.angle);
                ctx.strokeStyle = obj.color;
                ctx.lineWidth = 3;
                ctx.strokeRect(-obj.size/2, -obj.size/2, obj.size, obj.size);
                ctx.restore();

                // Вылет за экран
                if (obj.y > canvas.height + 60) {
                    if (obj.type !== 'err' && obj.type !== 'freeze') {
                        combo = 1;
                        takeDamage();
                    }
                    objects.splice(i, 1);
                    updateUI();
                }
            }

            // Искры
            for (var i = particles.length - 1; i >= 0; i--) {
                var p = particles[i];
                p.x += p.sx * currentMod;
                p.y += p.sy * currentMod + 0.1;
                p.life -= 0.03;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 3, 3);
                if (p.life <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1.0;

            // Тексты очков
            for (var i = floatingTexts.length - 1; i >= 0; i--) {
                var f = floatingTexts[i];
                f.y -= 1;
                f.life -= 0.03;
                ctx.fillStyle = f.color;
                ctx.font = "bold 16px monospace";
                ctx.fillText(f.text, f.x - 15, f.y);
                if (f.life <= 0) floatingTexts.splice(i, 1);
            }
        }

        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
