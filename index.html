<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private IT Node // SLICE ZONE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #010a01; color: #00ff41; font-family: monospace; overflow: hidden; height: 100vh; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 5; }
        #ui { position: relative; z-index: 10; text-align: center; padding: 15px; background: rgba(0,0,0,0.8); border-bottom: 2px solid #00ff41; pointer-events: none; }
        #score-val { font-size: 32px; color: #fff; text-shadow: 0 0 10px #00ff41; }
    </style>
</head>
<body>
    <div id="ui">
        <div style="letter-spacing: 2px;">FIREWALL SLICER // V2.0</div>
        <div id="score-val">0</div>
        <div style="font-size: 10px; opacity: 0.6;">SLICE THE NODES TO PROTECT TRAFFIC</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let objects = [];
    let trail = []; // След от свайпа

    // Аудио движок
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSliceSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    class DataNode {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height + 50;
            this.size = 30 + Math.random() * 20;
            this.speedX = (Math.random() - 0.5) * 4;
            this.speedY = - (12 + Math.random() * 5);
            this.gravity = 0.25;
            this.isSliced = false;
            this.color = score > 50 ? "#ff0044" : "#00ff41";
        }
        update() {
            this.x += this.speedX;
            this.speedY += this.gravity;
            this.y += this.speedY;
        }
        draw() {
            ctx.shadowBlur = 15; ctx.shadowColor = this.color;
            ctx.strokeStyle = this.color; ctx.lineWidth = 3;
            if (!this.isSliced) {
                ctx.strokeRect(this.x, this.y, this.size, this.size);
            } else {
                // Рисуем половинки, если разрезано
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + this.size, this.y + this.size); ctx.stroke();
            }
        }
    }

    function handleInput(ex, ey) {
        trail.push({x: ex, y: ey, life: 10});
        if (trail.length > 10) trail.shift();

        objects.forEach(obj => {
            if (!obj.isSliced && ex > obj.x && ex < obj.x + obj.size && ey > obj.y && ey < obj.y + obj.size) {
                obj.isSliced = true;
                score++;
                document.getElementById('score-val').innerText = score;
                playSliceSound();
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        });
    }

    window.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        handleInput(touch.clientX, touch.clientY);
    });

    function gameLoop() {
        ctx.fillStyle = "rgba(1, 10, 1, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Отрисовка следа (свайпа)
        ctx.beginPath();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
        for(let i=0; i<trail.length; i++) {
            ctx.lineTo(trail[i].x, trail[i].y);
        }
        ctx.stroke();

        if (Math.random() < 0.03) objects.push(new DataNode());

        objects.forEach((obj, index) => {
            obj.update();
            obj.draw();
            if (obj.y > canvas.height + 100) objects.splice(index, 1);
        });

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
