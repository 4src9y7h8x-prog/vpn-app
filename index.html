<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ELITE SLICER v4.0 PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-red: #ff003c;
            --neon-gold: #ffcc00;
            --neon-blue: #00f2ff;
        }

        body { 
            margin: 0; padding: 0; background: #000; color: var(--neon-green); 
            font-family: 'Courier New', monospace; overflow: hidden; 
            height: 100vh; touch-action: none; user-select: none;
        }

        /* Фоновое изображение с защитой (если файла нет, будет просто черный) */
        #bg-container { 
            position: fixed; inset: 0; 
            background: #000 url('IMG_2080.png') no-repeat center center; 
            background-size: cover; z-index: 0; 
        }
        #bg-overlay { 
            position: absolute; inset: 0; 
            background: radial-gradient(circle, rgba(0,20,0,0.3) 0%, rgba(0,0,0,0.95) 100%); 
            z-index: 1; 
        }
        
        canvas#matrix-canvas { position: absolute; inset: 0; z-index: 2; opacity: 0.1; }
        canvas#gameCanvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; }

        .crt-overlay { 
            position: fixed; inset: 0; z-index: 100; pointer-events: none; 
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02)); 
            background-size: 100% 3px, 3px 100%; 
        }
        
        #ui-header { position: relative; z-index: 50; padding: 20px; }
        .stats-row { display: flex; justify-content: space-between; align-items: flex-end; }
        #score-val { font-size: 48px; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--neon-green); font-family: sans-serif; }
        
        .bars-group { display: flex; flex-direction: column; gap: 5px; width: 140px; }
        .bar-wrapper { height: 8px; background: rgba(0,40,0,0.6); border: 1px solid var(--neon-green); overflow: hidden; }
        #exp-bar { width: 0%; height: 100%; background: var(--neon-green); transition: width 0.3s; }
        #overdrive-bar { width: 0%; height: 100%; background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }

        #start-screen { 
            position: fixed; inset: 0; z-index: 1000; background: #000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .btn-main { 
            background: var(--neon-green); color: #000; border: none; 
            padding: 20px 50px; font-size: 20px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 0 30px var(--neon-green); 
        }

        .overdrive-active { animation: od-pulse 0.5s infinite; }
        @keyframes od-pulse { 0% { box-shadow: inset 0 0 50px rgba(0,242,255,0.2); } 50% { box-shadow: inset 0 0 100px rgba(0,242,255,0.4); } 100% { box-shadow: inset 0 0 50px rgba(0,242,255,0.2); } }
    </style>
</head>
<body id="game-body">

    <div id="bg-container"><div id="bg-overlay"></div><canvas id="matrix-canvas"></canvas></div>
    <div class="crt-overlay"></div>

    <div id="start-screen">
        <h1 style="text-shadow: 0 0 15px var(--neon-green);">SYSTEM_SLICER</h1>
        <p style="color: var(--neon-blue); margin-bottom: 30px; font-size: 12px;">ENCRYPTED SESSION v4.0</p>
        <button id="start-btn" class="btn-main">INITIALIZE</button>
    </div>

    <div id="ui-header">
        <div class="stats-row">
            <div>
                <div style="font-size: 10px; color: var(--neon-blue);">RECOVERED_DATA:</div>
                <div id="score-val">0</div>
                <div id="combo-ui" style="color: var(--neon-gold); font-weight: bold; height: 20px;"></div>
            </div>
            <div class="bars-group">
                <div style="font-size: 9px;">BYPASS_LVL: <span id="lvl-num">1</span></div>
                <div class="bar-wrapper"><div id="exp-bar"></div></div>
                <div style="font-size: 9px; color: var(--neon-blue);">OVERDRIVE</div>
                <div class="bar-wrapper"><div id="overdrive-bar"></div></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mCanvas = document.getElementById('matrix-canvas');
    const mCtx = mCanvas.getContext('2d');

    let score = 0, level = 1, exp = 0, gameActive = false;
    let overdrive = 0, isOverdrive = false;
    let objects = [], trail = [], particles = [], floatingTexts = [];
    let combo = 0, lastHit = 0;

    // Безопасная загрузка аудио
    let bgMusic;
    try {
        bgMusic = new Audio('music.mp3');
        bgMusic.loop = true;
    } catch(e) { console.log("Audio file missing"); }

    mCanvas.width = window.innerWidth; mCanvas.height = window.innerHeight;
    const drops = Array(Math.floor(mCanvas.width/20)).fill(1);

    function drawMatrix() {
        mCtx.fillStyle = "rgba(0, 0, 0, 0.1)"; mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
        mCtx.fillStyle = isOverdrive ? "#0ff" : "#0f0";
        mCtx.font = "15px monospace";
        drops.forEach((y, i) => {
            const text = String.fromCharCode(0x30A0 + Math.random() * 96);
            mCtx.fillText(text, i*20, y*20);
            if(y*20 > mCanvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.sx = (Math.random() - 0.5) * 15;
            this.sy = (Math.random() - 0.5) * 15;
            this.life = 1.0; this.color = color;
        }
        update() { this.x += this.sx; this.y += this.sy; this.life -= 0.05; }
        draw() {
            ctx.fillStyle = this.color.replace('rgb', 'rgba').replace(')', `, ${this.life})`);
            ctx.fillRect(this.x, this.y, 2, 2);
        }
    }

    class DataNode {
        constructor() {
            this.size = 50;
            this.x = Math.random() * (window.innerWidth - 80) + 40;
            this.y = window.innerHeight + 50;
            this.sy = isOverdrive ? -20 : -(12 + level);
            this.sx = (Math.random() - 0.5) * 4;
            this.rot = 0;
            const r = Math.random();
            if (r < 0.15) { this.type = 'err'; this.color = 'rgb(255, 0, 60)'; }
            else if (r > 0.9) { this.type = 'gold'; this.color = 'rgb(255, 204, 0)'; }
            else { this.type = 'data'; this.color = isOverdrive ? 'rgb(0, 242, 255)' : 'rgb(0, 255, 65)'; }
        }
        update() { this.x += this.sx; this.sy += 0.4; this.y += this.sy; this.rot += 0.1; }
        draw() {
            ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
            ctx.strokeStyle = this.color; ctx.lineWidth = 3;
            ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
            ctx.restore();
        }
    }

    function handleInput(x, y) {
        if(!gameActive) return;
        trail.push({x, y, life: 1.0});
        objects.forEach((obj, i) => {
            if(Math.hypot(x - obj.x, y - obj.y) < 50) {
                for(let p=0; p<10; p++) particles.push(new Particle(obj.x, obj.y, obj.color));
                if (obj.type === 'err' && !isOverdrive) {
                    score = Math.max(0, score - 1000); combo = 0;
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                } else {
                    combo++; lastHit = Date.now();
                    score += (obj.type === 'gold' ? 500 : 100) * combo;
                    exp += 5;
                    if(!isOverdrive) {
                        overdrive += 5;
                        if(overdrive >= 100) { isOverdrive = true; document.getElementById('game-body').classList.add('overdrive-active'); }
                    }
                    if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                }
                objects.splice(i, 1);
                updateUI();
            }
        });
    }

    function updateUI() {
        document.getElementById('score-val').innerText = score;
        document.getElementById('combo-ui').innerText = combo > 1 ? "X" + combo : "";
        document.getElementById('exp-bar').style.width = exp + "%";
        document.getElementById('overdrive-bar').style.width = overdrive + "%";
        if(exp >= 100) { exp = 0; level++; document.getElementById('lvl-num').innerText = level; }
    }

    document.getElementById('start-btn').onclick = () => {
        gameActive = true;
        document.getElementById('start-screen').style.display = 'none';
        if(bgMusic) bgMusic.play().catch(() => {});
    };

    window.addEventListener('touchmove', (e) => {
        e.preventDefault();
        handleInput(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: false});

    function gameLoop() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        drawMatrix();
        if(gameActive) {
            if(trail.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = isOverdrive ? "#0ff" : "#fff"; ctx.lineWidth = 4;
                ctx.moveTo(trail[0].x, trail[0].y);
                for(let i=1; i<trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
                ctx.stroke();
                trail.forEach(t => t.life -= 0.1);
                trail = trail.filter(t => t.life > 0);
            }
            if(Math.random() < 0.05) objects.push(new DataNode());
            objects.forEach((obj, i) => {
                obj.update(); obj.draw();
                if(obj.y > window.innerHeight + 100) objects.splice(i, 1);
            });
            particles.forEach((p, i) => { p.update(); p.draw(); if(p.life <= 0) particles.splice(i, 1); });
            if(isOverdrive) {
                overdrive -= 0.2;
                if(overdrive <= 0) { isOverdrive = false; document.getElementById('game-body').classList.remove('overdrive-active'); }
            }
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
