<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private IT Node Anti-Stress</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #050a05;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; touch-action: none;
            display: flex; flex-direction: column;
            height: 100vh; user-select: none;
        }
        #stats {
            padding: 20px; text-align: center;
            border-bottom: 1px solid #00ff41;
            background: rgba(0, 0, 0, 0.9); z-index: 10;
        }
        #game-container { position: relative; width: 100%; flex-grow: 1; }
        .node {
            position: absolute; width: 85px; height: 85px;
            background: radial-gradient(circle, #00ff41 0%, #003300 70%);
            border-radius: 50%; box-shadow: 0 0 30px #00ff41;
            cursor: pointer; transition: transform 0.1s;
        }
        .particle {
            position: absolute; width: 3px; height: 3px;
            background-color: #00ff41; border-radius: 50%; pointer-events: none;
        }
        .glitch-text { font-weight: bold; letter-spacing: 2px; text-shadow: 1px 1px #ff0000, -1px -1px #0000ff; }
    </style>
</head>
<body>

    <div id="stats">
        <div class="glitch-text">PRIVATE IT NODE // ZONE</div>
        <div style="margin-top: 5px; font-size: 14px;">NODES PROCESSED: <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <div id="node" class="node"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const node = document.getElementById('node');
        const scoreEl = document.getElementById('score');
        const container = document.getElementById('game-container');
        let score = 0;

        // Создаем аудио-контекст для синтеза звука (чтобы не грузить файлы)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playPopSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // Фоновый эмбиент (синтезированный шум для атмосферы)
        function playAmbient() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(60, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
        }

        function moveNode() {
            const rect = container.getBoundingClientRect();
            const x = Math.random() * (rect.width - 100);
            const y = Math.random() * (rect.height - 100);
            node.style.left = x + 'px';
            node.style.top = y + 'px';
        }

        node.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (score === 0) playAmbient(); // Включаем фон при первом клике
            
            score++;
            scoreEl.innerText = score;
            
            playPopSound();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('rigid');

            moveNode();
        });

        moveNode();
    </script>
</body>
</html>
