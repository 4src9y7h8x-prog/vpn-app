<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIVATE IT NODE // ULTRA SLICER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; touch-action: none; -webkit-user-select: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 5; }
        
        /* Интерфейс в стиле хакерского терминала */
        #ui { position: relative; z-index: 10; text-align: center; padding: 10px; background: rgba(0,0,0,0.85); border-bottom: 2px solid #00ff41; pointer-events: none; }
        #score-container { display: flex; justify-content: space-around; align-items: center; }
        #score-val { font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ff41; }
        #lvl-tag { font-size: 14px; color: #00ff41; border: 1px solid #00ff41; padding: 2px 6px; text-transform: uppercase; }
        
        #status-bar { font-size: 10px; color: #ffcc00; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        #progress-wrapper { width: 100%; height: 6px; background: #052b05; margin-top: 10px; overflow: hidden; border-radius: 3px; }
        #progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ff41, #fff); transition: width 0.2s; box-shadow: 0 0 10px #00ff41; }
        
        #start-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; text-align: center; background: #00ff41; color: #000;
            padding: 30px 60px; font-weight: 900; font-size: 24px; cursor: pointer;
            box-shadow: 0 0 50px #00ff41; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            border: none; outline: none;
        }

        /* Эффект сканирования */
        .scanline { width: 100%; height: 100%; position: absolute; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 20; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <button id="start-btn">RUN SYSTEM.EXE</button>
    
    <div id="ui">
        <div id="score-container">
            <div>DATA_UNITS: <span id="score-val">0</span></div>
            <div id="lvl-tag">Level: <span id="lvl-num">1</span></div>
        </div>
        <div id="status-bar">STATUS: READY_TO_SLICE // AUDIO: music.mp3</div>
        <div id="progress-wrapper"><div id="progress-fill"></div></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const audio = new Audio("music.mp3");
    audio.loop = true;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0; let level = 1; let exp = 0;
    let objects = []; let particles = []; let texts = []; let trail = [];
    let gameActive = false; let shake = 0; let glitchFrame = 0;

    document.getElementById('start-btn').addEventListener('click', function() {
        gameActive = true;
        this.style.display = 'none';
        audio.play().catch(() => alert("Error: music.mp3 not found!"));
    });

    class FloatingText {
        constructor(x, y, text, color = "#fff", size = 20) {
            this.x = x; this.y = y; this.text = text; this.color = color;
            this.size = size; this.life = 1.0;
        }
        update() { this.y -= 2; this.life -= 0.025; }
        draw() {
            ctx.save(); ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
            ctx.font = `bold ${this.size}px monospace`; ctx.fillText(this.text, this.x, this.y); ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color = "#00ff41") {
            this.x = x; this.y = y;
            this.speedX = (Math.random() - 0.5) * 15;
            this.speedY = (Math.random() - 0.5) * 15;
            this.life = 1.0; this.color = color;
        }
        update() { this.x += this.speedX; this.y += this.speedY; this.life -= 0.05; }
        draw() { ctx.fillStyle = this.color; ctx.globalAlpha = this.life; ctx.fillRect(this.x, this.y, 4, 4); }
    }

    class Node {
        constructor() {
            this.size = 40 + Math.random() * 20;
            this.x = 50 + Math.random() * (canvas.width - 100);
            this.y = canvas.height + 50;
            this.sy = -(13 + level + Math.random() * 5);
            this.sx = (Math.random() - 0.5) * (4 + level);
            this.rot = 0;
            this.rotV = (Math.random() - 0.5) * 0.2;
        }
        update() { this.x += this.sx; this.sy += 0.38; this.y += this.sy; this.rot += this.rotV; }
        draw() {
            ctx.save(); ctx.translate(this.x + this.size/2, this.y + this.size/2); ctx.rotate(this.rot);
            ctx.strokeStyle = "#00ff41"; ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = "#00ff41";
            ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
            ctx.restore();
        }
    }

    function handleInput(ex, ey) {
        if (!gameActive) return;
        trail.push({x: ex, y: ey, life: 1.0});
        
        objects.forEach((obj, i) => {
            let dx = ex - (obj.x + obj.size/2);
            let dy = ey - (obj.y + obj.size/2);
            if (Math.abs(dx) < 50 && Math.abs(dy) < 50) {
                score++; exp += 4; shake = 8;
                for(let p=0; p<15; p++) particles.push(new Particle(obj.x + obj.size/2, obj.y + obj.size/2));
                
                // Рандомные надписи при ударе
                const tags = ["DELETED", "CLEARED", "VOID", "NULL"];
                texts.push(new FloatingText(obj.x, obj.y, tags[Math.floor(Math.random()*tags.length)], "#fff", 18));
                
                objects.splice(i, 1);
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        });
    }

    function updateUI() {
        if (exp >= 100) { 
            level++; exp = 0; glitchFrame = 20;
            texts.push(new FloatingText(canvas.width/2 - 60, canvas.height/2, "LEVEL_UP", "#00ff41", 30));
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
        document.getElementById('score-val').innerText = score;
        document.getElementById('lvl-num').innerText = level;
        document.getElementById('progress-fill').style.width = exp + "%";
    }

    window.addEventListener('touchmove', (e) => handleInput(e.touches[0].clientX, e.touches[0].clientY));

    function gameLoop() {
        // Эффект глитча при смене уровня
        if (glitchFrame > 0) {
            ctx.fillStyle = Math.random() > 0.5 ? "#00ff41" : "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            glitchFrame--;
        } else {
            ctx.setTransform(1,0,0,1,0,0);
            ctx.fillStyle = "rgba(0,0,0,0.35)";
            ctx.fillRect(0,0,canvas.width, canvas.height);
        }
        
        if (shake > 0) { ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2); shake *= 0.85; }

        if (gameActive) {
            // След свайпа
            if (trail.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 6; ctx.lineCap = "round";
                ctx.moveTo(trail[0].x, trail[0].y);
                for(let i=1; i<trail.length; i++) { ctx.lineTo(trail[i].x, trail[i].y); trail[i].life -= 0.15; }
                ctx.stroke(); trail = trail.filter(t => t.life > 0);
            }

            // Шанс появления узла зависит от уровня
            if (Math.random() < (0.04 + level * 0.012)) objects.push(new Node());

            objects.forEach((obj, i) => { obj.update(); obj.draw(); if (obj.y > canvas.height + 100) objects.splice(i, 1); });
            particles.forEach((p, i) => { p.update(); p.draw(); if (p.life <= 0) particles.splice(i, 1); });
            texts.forEach((t, i) => { t.update(); t.draw(); if (t.life <= 0) texts.splice(i, 1); });
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
