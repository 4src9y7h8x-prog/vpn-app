<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIVATE IT NODE // RAGE EDITION</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; touch-action: none; -webkit-user-select: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 5; }
        
        #ui { position: relative; z-index: 10; padding: 10px; background: rgba(0,0,0,0.8); border-bottom: 2px solid #00ff41; pointer-events: none; }
        #stats-row { display: flex; justify-content: space-between; align-items: center; }
        #score-val { font-size: 32px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #00ff41; }
        #hp-bar { color: #ff3333; font-weight: bold; letter-spacing: 2px; }
        
        #progress-container { width: 100%; height: 6px; background: #111; margin-top: 8px; border: 1px solid #00ff41; }
        #progress-bar { width: 0%; height: 100%; background: #00ff41; transition: width 0.1s; }
        
        .rage-active #progress-bar { background: #fff; box-shadow: 0 0 20px #fff; animation: blink 0.2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 100; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center;
        }
        .start-btn {
            background: #00ff41; color: #000; padding: 25px 50px; font-size: 28px; font-weight: 900;
            border: none; cursor: pointer; box-shadow: 0 0 40px #00ff41;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1 style="color: #00ff41; margin-bottom: 30px; letter-spacing: 5px;">PRIVATE IT NODE</h1>
        <button class="start-btn" onclick="startGame()">CONNECT</button>
        <p style="margin-top: 20px; font-size: 10px; opacity: 0.6;">Slicing script v3.0 // High latency mitigation active</p>
    </div>
    
    <div id="ui">
        <div id="stats-row">
            <div id="hp-bar">HP: [III]</div>
            <div>NODES: <span id="score-val">0</span></div>
            <div id="combo-ui" style="color: #ffcc00;">x1</div>
        </div>
        <div id="progress-container"><div id="progress-bar"></div></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const audio = new Audio("music.mp3"); audio.loop = true;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0; let level = 1; let exp = 0; let hp = 3;
    let combo = 1; let comboTimer = 0;
    let gameActive = false; let shake = 0; let isRage = false;
    let objects = []; let particles = []; let texts = []; let trail = [];

    function startGame() {
        gameActive = true;
        document.getElementById('start-screen').style.display = 'none';
        audio.play();
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.vx = (Math.random() - 0.5) * 15;
            this.vy = (Math.random() - 0.5) * 15;
            this.life = 1.0;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= 0.04; }
        draw() { ctx.fillStyle = this.color; ctx.globalAlpha = this.life; ctx.fillRect(this.x, this.y, 3, 3); }
    }

    class Node {
        constructor(isVirus = false) {
            this.size = 45; this.isVirus = isVirus;
            this.x = 50 + Math.random() * (canvas.width - 100);
            this.y = canvas.height + 50;
            this.sy = -(14 + level + (isRage ? 5 : 0));
            this.sx = (Math.random() - 0.5) * 6;
        }
        update() { this.x += this.sx; this.sy += 0.35; this.y += this.sy; }
        draw() {
            ctx.save();
            ctx.strokeStyle = this.isVirus ? "#ff3333" : "#00ff41";
            ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = ctx.strokeStyle;
            ctx.strokeRect(this.x, this.y, this.size, this.size);
            if(this.isVirus) { ctx.fillStyle = "#ff3333"; ctx.fillRect(this.x+15, this.y+15, 15, 15); }
            ctx.restore();
        }
    }

    function handleInput(ex, ey) {
        if (!gameActive) return;
        trail.push({x: ex, y: ey, life: 1.0});
        
        objects.forEach((obj, i) => {
            if (ex > obj.x && ex < obj.x + obj.size && ey > obj.y && ey < obj.y + obj.size) {
                if (obj.isVirus) {
                    hp--; shake = 25; exp = 0; combo = 1;
                    for(let p=0; p<20; p++) particles.push(new Particle(ex, ey, "#ff3333"));
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                } else {
                    comboTimer = 60; combo++;
                    let points = (isRage ? 20 : 5) * Math.floor(combo/5 + 1);
                    score += points; exp += 8; shake = 8;
                    for(let p=0; p<15; p++) particles.push(new Particle(ex, ey, "#00ff41"));
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                }
                objects.splice(i, 1);
                updateUI();
            }
        });
    }

    function updateUI() {
        if (exp >= 100 && !isRage) { activateRage(); }
        if (hp <= 0) location.reload(); // Перезагрузка при смерти
        
        document.getElementById('score-val').innerText = score;
        document.getElementById('combo-ui').innerText = "x" + Math.floor(combo/5 + 1);
        document.getElementById('hp-bar').innerText = "HP: [" + "I".repeat(hp) + "]";
        document.getElementById('progress-bar').style.width = exp + "%";
    }

    function activateRage() {
        isRage = true;
        document.body.classList.add('rage-active');
        setTimeout(() => { 
            isRage = false; exp = 0; 
            document.body.classList.remove('rage-active');
            updateUI();
        }, 5000);
    }

    window.addEventListener('touchmove', (e) => handleInput(e.touches[0].clientX, e.touches[0].clientY));

    function gameLoop() {
        ctx.fillStyle = isRage ? "rgba(40,0,0,0.4)" : "rgba(0,0,0,0.4)";
        ctx.fillRect(0,0,canvas.width, canvas.height);
        
        if (shake > 0) { ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2); shake *= 0.9; }

        if (gameActive) {
            if (trail.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = isRage ? "#ff3333" : "#fff"; ctx.lineWidth = 5;
                ctx.moveTo(trail[0].x, trail[0].y);
                for(let i=1; i<trail.length; i++) { ctx.lineTo(trail[i].x, trail[i].y); trail[i].life -= 0.1; }
                ctx.stroke(); trail = trail.filter(t => t.life > 0);
            }

            let spawnChance = isRage ? 0.15 : (0.05 + level * 0.01);
            if (Math.random() < spawnChance) {
                let isVirus = !isRage && Math.random() < 0.15;
                objects.push(new Node(isVirus));
            }

            objects.forEach((obj, i) => { 
                obj.update(); obj.draw(); 
                if (obj.y > canvas.height + 100) {
                    if (!obj.isVirus) { hp--; updateUI(); } // Штраф за пропуск
                    objects.splice(i, 1);
                }
            });
            particles.forEach((p, i) => { p.update(); p.draw(); if (p.life <= 0) particles.splice(i, 1); });
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
