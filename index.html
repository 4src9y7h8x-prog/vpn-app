<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIVATE IT NODE // ELITE SLICER v2.1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; touch-action: none; -webkit-user-select: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 5; }
        
        /* Элитный хедер */
        #ui-header { 
            position: relative; z-index: 10; padding: 15px; 
            background: rgba(0, 0, 0, 0.9); 
            border-bottom: 2px solid #00ff41; 
            pointer-events: none;
            box-shadow: 0 5px 20px rgba(0, 255, 65, 0.3);
        }
        #title { font-size: 16px; letter-spacing: 2px; color: #00ff41; text-transform: uppercase; margin-bottom: 5px; }
        #stats-row { display: flex; justify-content: space-between; align-items: flex-end; }
        #score-display { text-align: left; }
        #score-val { font-size: 42px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ff41; line-height: 1; }
        #best-score { font-size: 12px; color: #ffcc00; margin-top: 2px; }
        
        #level-display { text-align: right; }
        #lvl-tag { font-size: 12px; color: #00ff41; border: 1px solid #00ff41; padding: 2px 6px; text-transform: uppercase; }
        #progress-wrapper { width: 100px; height: 6px; background: #052b05; margin-top: 5px; border-radius: 3px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: #00ff41; transition: width 0.2s; box-shadow: 0 0 10px #00ff41; }
        
        /* Кнопка старта */
        #start-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; text-align: center; background: #00ff41; color: #000;
            padding: 25px 50px; font-weight: bold; font-size: 22px; cursor: pointer;
            box-shadow: 0 0 40px #00ff41; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            border: none; outline: none;
        }

        /* Инфо-панели снизу (декор) */
        #ui-footer { position: absolute; bottom: 10px; left: 10px; z-index: 10; pointer-events: none; }
        .info-pane { background: rgba(0,0,0,0.7); border: 1px solid rgba(0,255,65,0.3); padding: 5px 10px; font-size: 10px; color: rgba(0,255,65,0.6); margin-top: 5px; max-width: 150px; text-align: left; }
    </style>
</head>
<body>
    <button id="start-btn">INITIALIZE SLICER</button>
    
    <div id="ui-header">
        <div id="title">PRIVATE IT NODE // Elite Slicer</div>
        <div id="stats-row">
            <div id="score-display">
                <div id="score-val">0</div>
                <div id="best-score">BEST: <span id="best-val">0</span></div>
            </div>
            <div id="level-display">
                <span id="lvl-tag">Level <span id="lvl-num">1</span></span>
                <div id="progress-wrapper"><div id="progress-fill"></div></div>
            </div>
        </div>
    </div>

    <div id="ui-footer">
        <div class="info-pane">
            [SYS_MONITOR]<br>
            PACKET_DECRYPTION: ACTIVE<br>
            CORE_TEMP: OPTIMAL
        </div>
        <div class="info-pane">
            [AUDIO_FEED]<br>
            SOURCE: music.mp3
        </div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

<script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Аудио поток (music.mp3 должен быть в корне)
    const audio = new Audio("music.mp3");
    audio.loop = true;
    audio.preload = "auto"; // Оптимизация загрузки

    // Установка размеров Canvas
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Игровые переменные
    let score = 0;
    let level = 1;
    let exp = 0;
    let bestScore = localStorage.getItem('slicer_best_elite') || 0;
    document.getElementById('best-val').innerText = bestScore;

    let objects = [];
    let particles = [];
    let texts = [];
    let trail = [];
    let gameActive = false;
    let shake = 0;
    let frameCount = 0;

    // Обработка кнопки Старт
    document.getElementById('start-btn').addEventListener('click', function() {
        gameActive = true;
        this.style.display = 'none';
        audio.play().catch(() => alert("Error: music.mp3 not found!"));
    });

    // Класс плавающего текста (DELETED, +1)
    class FloatingText {
        constructor(x, y, text) {
            this.x = x; this.y = y; this.text = text; this.life = 1.0;
        }
        update() { this.y -= 2; this.life -= 0.025; }
        draw() {
            ctx.save(); ctx.globalAlpha = this.life; ctx.fillStyle = "#fff";
            ctx.font = "bold 20px monospace"; ctx.fillText(this.text, this.x, this.y); ctx.restore();
        }
    }

    // Класс частиц (оптимизированный)
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.speedX = (Math.random() - 0.5) * 12;
            this.speedY = (Math.random() - 0.5) * 12;
            this.life = 1.0;
        }
        update() { this.x += this.speedX; this.y += this.speedY; this.life -= 0.05; }
        draw() { ctx.fillStyle = this.color; ctx.globalAlpha = this.life; ctx.fillRect(this.x, this.y, 3, 3); }
    }

    // Класс Элитного Узла Данных (кристаллический стиль как на image_3.png)
    class EliteNode {
        constructor() {
            this.size = 40 + Math.random() * 20;
            this.x = 50 + Math.random() * (canvas.width - 100);
            this.y = canvas.height + 50;
            this.speedY = -(14 + level + Math.random() * 4);
            this.speedX = (Math.random() - 0.5) * (5 + level);
            this.rotation = 0;
            this.rotationSpeed = (Math.random() - 0.5) * 0.1;
        }
        update() { this.x += this.speedX; this.speedY += 0.35; this.y += this.speedY; this.rotation += this.rotationSpeed; }
        draw() {
            ctx.save(); ctx.translate(this.x + this.size/2, this.y + this.size/2); ctx.rotate(this.rotation);
            
            // Внешний контур (как на image_3.png)
            ctx.strokeStyle = "#00ff41"; ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = "#00ff41";
            ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
            
            // Внутренние линии "схемы"
            ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(0, 255, 65, 0.5)"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(-this.size/2, 0); ctx.lineTo(this.size/2, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -this.size/2); ctx.lineTo(0, this.size/2); ctx.stroke();
            
            ctx.restore();
        }
    }

    // Обработка ввода (Свайп)
    function handleInput(ex, ey) {
        if (!gameActive) return;
        // Добавляем точку в хвост
        trail.push({x: ex, y: ey, life: 1.0});
        
        objects.forEach((obj, i) => {
            // Проверка попадания по узлу
            let dx = ex - (obj.x + obj.size/2);
            let dy = ey - (obj.y + obj.size/2);
            if (Math.abs(dx) < 45 && Math.abs(dy) < 45) {
                score++; exp += 4; shake = 8;
                // Спавн частиц зеленого цвета
                for(let p=0; p<12; p++) particles.push(new Particle(obj.x + obj.size/2, obj.y + obj.size/2, "#00ff41"));
                // Всплывающий текст
                texts.push(new FloatingText(obj.x, obj.y, "DELETED"));
                objects.splice(i, 1);
                updateUI();
                // Виброотклик Telegram
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        });
    }

    // Обновление интерфейса
    function updateUI() {
        if (exp >= 100) { level++; exp = 0; shake = 15; texts.push(new FloatingText(canvas.width/2 - 50, canvas.height/2, "LEVEL UP!")); if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); }
        if (score > bestScore) { bestScore = score; localStorage.setItem('slicer_best_elite', bestScore); document.getElementById('best-val').innerText = bestScore; }
        document.getElementById('score-val').innerText = score;
        document.getElementById('lvl-num').innerText = level;
        document.getElementById('progress-fill').style.width = exp + "%";
    }

    // Слушатель событий касания
    window.addEventListener('touchmove', (e) => handleInput(e.touches[0].clientX, e.touches[0].clientY));

    // Основной игровой цикл
    function gameLoop() {
        frameCount++;
        
        // Эффект шлейфа (фон)
        ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(0,0,canvas.width, canvas.height);
        
        // Эффект тряски экрана
        ctx.save(); if (shake > 0) { ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2); shake *= 0.9; }

        if (gameActive) {
            // Отрисовка Элитного Хвоста (пульсирует синим и белым, как на image_3.png)
            if (trail.length > 1) {
                ctx.beginPath(); 
                ctx.strokeStyle = `hsl(180, 100%, ${60 + Math.sin(frameCount/3)*20}%)`; // Пульсация синего
                ctx.lineWidth = 6; ctx.lineCap = "round";
                ctx.moveTo(trail[0].x, trail[0].y);
                for(let i=1; i<trail.length; i++) { ctx.lineTo(trail[i].x, trail[i].y); trail[i].life -= 0.15; } // Быстрое затухание (оптимизация)
                ctx.stroke(); 
                
                // Спавн частиц хвоста
                if (frameCount % 2 === 0) particles.push(new Particle(trail[trail.length-1].x, trail[trail.length-1].y, "#fff"));
                
                trail = trail.filter(t => t.life > 0);
            }

            // Шанс появления нового узла (зависит от уровня)
            if (Math.random() < (0.04 + level * 0.012)) objects.push(new EliteNode());

            // Оптимизация: Жесткий лимит частиц
            if (particles.length > 40) particles.splice(0, particles.length - 40);

            // Обновление и отрисовка всех объектов
            objects.forEach((obj, i) => { obj.update(); obj.draw(); if (obj.y > canvas.height + 100) objects.splice(i, 1); });
            particles.forEach((p, i) => { p.update(); p.draw(); if (p.life <= 0) particles.splice(i, 1); });
            texts.forEach((t, i) => { t.update(); t.draw(); if (t.life <= 0) texts.splice(i, 1); });
        }
        
        ctx.restore(); // Сброс тряски
        requestAnimationFrame(gameLoop);
    }

    // Запуск цикла
    gameLoop();
</script>
</body>
</html>
