<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private IT Node Anti-Stress</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050a05; /* Глубокий черный */
            color: #00ff41; /* Тот самый зеленый */
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }

        #stats {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #00ff41;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
            position: absolute;
            top: 0;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .node {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #00ff41 0%, #003300 70%);
            border-radius: 50%;
            box-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #00ff41;
            border-radius: 50%;
            pointer-events: none;
        }

        .glitch-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px #ff0000, -1px -1px #0000ff;
        }
    </style>
</head>
<body>

    <div id="stats">
        <div class="glitch-text">PRIVATE IT NODE // ZONE</div>
        <div style="margin-top: 5px; font-size: 14px;">NODES PROCESSED: <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <div id="node" class="node"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        tg.headerColor = '#050a05';

        const node = document.getElementById('node');
        const scoreEl = document.getElementById('score');
        const container = document.getElementById('game-container');
        let score = 0;

        // Функция перемещения "узла"
        function moveNode() {
            const padding = 100;
            const maxX = window.innerWidth - padding;
            const maxY = window.innerHeight - padding;
            
            // Ограничиваем, чтобы не залетало под шапку
            const newX = Math.max(20, Math.random() * maxX);
            const newY = Math.max(120, Math.random() * maxY);

            node.style.left = newX + 'px';
            node.style.top = newY + 'px';
        }

        // Эффект взрыва частиц
        function createParticles(x, y) {
            for (let i = 0; i < 10; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                
                container.appendChild(p);

                let life = 1;
                const interval = setInterval(() => {
                    life -= 0.05;
                    p.style.left = (parseFloat(p.style.left) + vx) + 'px';
                    p.style.top = (parseFloat(p.style.top) + vy) + 'px';
                    p.style.opacity = life;
                    if (life <= 0) {
                        clearInterval(interval);
                        p.remove();
                    }
                }, 30);
            }
        }

        // Обработка клика/тапа
        node.addEventListener('touchstart', (e) => {
            e.preventDefault();
            score++;
            scoreEl.innerText = score;

            // Хактильный отклик (вибрация в TG)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            const rect = node.getBoundingClientRect();
            createParticles(rect.left + 40, rect.top + 40);
            
            moveNode();
        });

        // Первая позиция
        moveNode();
    </script>
</body>
</html>
