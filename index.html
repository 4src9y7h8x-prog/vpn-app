<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ELITE SLICER v5.0 ULTRA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-green: #00ff41; --neon-red: #ff003c;
            --neon-gold: #ffcc00; --neon-blue: #00f2ff;
        }
        body { 
            margin: 0; padding: 0; background: #000; color: var(--neon-green); 
            font-family: 'Courier New', monospace; overflow: hidden; 
            height: 100vh; touch-action: none; user-select: none;
        }
        #bg-container { position: fixed; inset: 0; background: #000 url('IMG_2080.png') no-repeat center center; background-size: cover; z-index: 0; transition: transform 0.1s; }
        #bg-overlay { position: absolute; inset: 0; background: radial-gradient(circle, rgba(0,20,0,0.2) 0%, rgba(0,0,0,0.9) 100%); z-index: 1; }
        canvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        #matrix-canvas { z-index: 2; opacity: 0.15; }

        /* UI Elements */
        #ui-header { position: relative; z-index: 50; padding: 20px; display: flex; justify-content: space-between; }
        #score-val { font-size: 50px; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--neon-green); line-height: 1; }
        .hp-container { display: flex; gap: 5px; margin-top: 5px; }
        .hp-dot { width: 15px; height: 15px; border: 1px solid var(--neon-red); background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }
        .hp-dot.lost { background: transparent; box-shadow: none; opacity: 0.3; }

        /* Screens */
        .modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-main { background: var(--neon-green); color: #000; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 0 30px var(--neon-green); margin-top: 20px; }
        
        /* Animations */
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-10px, 5px); } 50% { transform: translate(10px, -5px); } }
        .shake { animation: shake 0.2s ease-in-out; }
    </style>
</head>
<body id="main-body">

    <div id="bg-container"><div id="bg-overlay"></div><canvas id="matrix-canvas"></canvas></div>

    <!-- Экран старта -->
    <div id="start-screen" class="modal">
        <h1 style="text-shadow: 0 0 15px var(--neon-green);">ELITE_SLICER_v5</h1>
        <p style="color: var(--neon-blue);">STABLE UPLINK DETECTED</p>
        <button id="start-btn" class="btn-main">CONNECT</button>
    </div>

    <!-- Экран смерти -->
    <div id="death-screen" class="modal" style="display: none;">
        <h1 style="color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red);">CONNECTION_LOST</h1>
        <div id="final-stats" style="margin: 20px 0; line-height: 1.6;"></div>
        <button id="restart-btn" class="btn-main">REBOOT SYSTEM</button>
    </div>

    <div id="ui-header">
        <div>
            <div id="score-val">0</div>
            <div id="hp-box" class="hp-container">
                <div class="hp-dot"></div><div class="hp-dot"></div><div class="hp-dot"></div>
            </div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 10px;">COMBO</div>
            <div id="combo-ui" style="font-size: 24px; color: var(--neon-gold); font-weight: bold;">X1</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mCanvas = document.getElementById('matrix-canvas');
    const mCtx = mCanvas.getContext('2d');
    const body = document.getElementById('main-body');

    let score = 0, hp = 3, combo = 1, gameActive = false, maxCombo = 1;
    let objects = [], trail = [], particles = [], floatingTexts = [];
    let bgMusic = new Audio('music.mp3'); bgMusic.loop = true;

    // Matrix BG
    mCanvas.width = window.innerWidth; mCanvas.height = window.innerHeight;
    const drops = Array(Math.floor(mCanvas.width/20)).fill(1);
    function drawMatrix() {
        mCtx.fillStyle = "rgba(0, 0, 0, 0.1)"; mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
        mCtx.fillStyle = "#0f0"; mCtx.font = "15px monospace";
        drops.forEach((y, i) => {
            mCtx.fillText(String.fromCharCode(0x30A0 + Math.random()*96), i*20, y*20);
            if(y*20 > mCanvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }

    class DataNode {
        constructor() {
            this.size = 50;
            this.x = Math.random() * (window.innerWidth - 60) + 30;
            this.y = window.innerHeight + 50;
            this.sy = -(12 + Math.random()*6);
            this.sx = (Math.random() - 0.5) * 4;
            const r = Math.random();
            if(r < 0.15) { this.type = 'err'; this.color = 'rgb(255, 0, 60)'; }
            else if(r > 0.9) { this.type = 'gold'; this.color = 'rgb(255, 204, 0)'; }
            else { this.type = 'data'; this.color = 'rgb(0, 255, 65)'; }
        }
        update() { this.x += this.sx; this.sy += 0.35; this.y += this.sy; }
        draw() {
            ctx.strokeStyle = this.color; ctx.lineWidth = 3; ctx.shadowBlur = 10; ctx.shadowColor = this.color;
            ctx.strokeRect(this.x - 25, this.y - 25, 50, 50);
        }
    }

    function triggerShake() {
        body.classList.add('shake');
        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        setTimeout(() => body.classList.remove('shake'), 200);
    }

    function takeDamage() {
        hp--;
        const dots = document.querySelectorAll('.hp-dot');
        if(dots[hp]) dots[hp].classList.add('lost');
        triggerShake();
        if(hp <= 0) endGame();
    }

    function handleInput(x, y) {
        if(!gameActive) return;
        trail.push({x, y, life: 1.0});
        objects.forEach((obj, i) => {
            if(Math.hypot(x - obj.x, y - obj.y) < 45) {
                // Sparks
                for(let p=0; p<15; p++) particles.push({x: obj.x, y: obj.y, sx: (Math.random()-0.5)*10, sy: (Math.random()-0.5)*10, life: 1, color: obj.color});
                
                if(obj.type === 'err') {
                    combo = 1; takeDamage();
                } else {
                    let pts = (obj.type === 'gold' ? 500 : 100) * combo;
                    score += pts;
                    if(combo > maxCombo) maxCombo = combo;
                    combo++;
                    floatingTexts.push({x: obj.x, y: obj.y, text: `+${pts}`, color: obj.color, life: 1});
                    if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                }
                objects.splice(i, 1);
                updateUI();
            }
        });
    }

    function updateUI() {
        document.getElementById('score-val').innerText = score;
        document.getElementById('combo-ui').innerText = "X" + combo;
    }

    function endGame() {
        gameActive = false;
        document.getElementById('death-screen').style.display = 'flex';
        document.getElementById('final-stats').innerHTML = `
            DATA_EXTRACTED: ${score} MB<br>
            MAX_STREAK: X${maxCombo}<br>
            NODE_STATUS: DISCONNECTED
        `;
    }

    function resetGame() {
        score = 0; hp = 3; combo = 1; objects = []; particles = [];
        document.querySelectorAll('.hp-dot').forEach(d => d.classList.remove('lost'));
        document.getElementById('death-screen').style.display = 'none';
        updateUI(); gameActive = true;
    }

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('start-screen').style.display = 'none';
        gameActive = true; bgMusic.play().catch(() => {});
    };

    document.getElementById('restart-btn').onclick = resetGame;

    window.addEventListener('touchmove', (e) => {
        e.preventDefault(); handleInput(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: false});

    function loop() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        drawMatrix();
        if(gameActive) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Trail
            if(trail.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
                ctx.moveTo(trail[0].x, trail[0].y);
                trail.forEach(t => ctx.lineTo(t.x, t.y));
                ctx.stroke();
                trail.forEach(t => t.life -= 0.1); trail = trail.filter(t => t.life > 0);
            }
            // Objects
            if(Math.random() < 0.04) objects.push(new DataNode());
            objects.forEach((obj, i) => {
                obj.update(); obj.draw();
                if(obj.y > window.innerHeight + 100) { 
                    if(obj.type !== 'err') { combo = 1; takeDamage(); }
                    objects.splice(i, 1); updateUI();
                }
            });
            // Particles & Text
            particles.forEach((p, i) => {
                p.x += p.sx; p.y += p.sy; p.life -= 0.03;
                ctx.fillStyle = p.color.replace('rgb', 'rgba').replace(')', `, ${p.life})`);
                ctx.fillRect(p.x, p.y, 2, 2);
                if(p.life <= 0) particles.splice(i, 1);
            });
            floatingTexts.forEach((f, i) => {
                ctx.fillStyle = f.color; ctx.font = "20px Courier";
                ctx.fillText(f.text, f.x, f.y); f.y -= 2; f.life -= 0.02;
                if(f.life <= 0) floatingTexts.splice(i, 1);
            });
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
