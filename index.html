<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIVATE IT NODE // ELITE SLICER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; touch-action: none; -webkit-user-select: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 5; }
        
        #ui { position: relative; z-index: 10; text-align: center; padding: 10px; background: rgba(0,0,0,0.9); border-bottom: 2px solid #00ff41; pointer-events: none; }
        #score-container { display: flex; justify-content: space-around; align-items: center; }
        #score-val { font-size: 42px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ff41; }
        #lvl-val { font-size: 20px; color: #00ff41; border: 1px solid #00ff41; padding: 5px 10px; }
        
        #progress-bar-container { width: 100%; height: 5px; background: #052b05; margin-top: 10px; }
        #progress-bar { width: 0%; height: 100%; background: #00ff41; transition: width 0.3s; box-shadow: 0 0 10px #00ff41; }
        
        #start-prompt { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; text-align: center; background: #00ff41; color: #000;
            padding: 20px 40px; font-weight: bold; font-size: 20px; cursor: pointer;
            box-shadow: 0 0 30px #00ff41; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }
    </style>
</head>
<body>
    <div id="start-prompt">ЗАПУСТИТЬ УРОВЕНЬ 1</div>
    
    <div id="ui">
        <div id="score-container">
            <div>CORE_SCORE: <span id="score-val">0</span></div>
            <div id="lvl-val">LVL 1</div>
        </div>
        <div id="progress-bar-container"><div id="progress-bar"></div></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    <audio id="bgMusic" src="music.mp3" loop></audio>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startPrompt = document.getElementById('start-prompt');
    const music = document.getElementById('bgMusic');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let level = 1;
    let exp = 0;
    let objects = [];
    let particles = [];
    let texts = []; // Летающие надписи
    let trail = [];
    let gameActive = false;
    let shake = 0;

    startPrompt.addEventListener('click', () => {
        gameActive = true;
        startPrompt.style.display = 'none';
        music.play().catch(() => {});
    });

    class FloatingText {
        constructor(x, y, text, color) {
            this.x = x; this.y = y;
            this.text = text; this.color = color;
            this.life = 1.0; this.speedY = -2;
        }
        update() { this.y += this.speedY; this.life -= 0.02; }
        draw() {
            ctx.save(); ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
            ctx.font = "bold 24px monospace"; ctx.fillText(this.text, this.x, this.y); ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.size = Math.random() * 4 + 1;
            this.speedX = (Math.random() - 0.5) * 12;
            this.speedY = (Math.random() - 0.5) * 12;
            this.life = 1.0; this.color = color;
        }
        update() { this.x += this.speedX; this.y += this.speedY; this.life -= 0.03; }
        draw() { ctx.fillStyle = this.color; ctx.globalAlpha = this.life; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha = 1; }
    }

    class DataNode {
        constructor(isBomb = false) {
            this.x = 50 + Math.random() * (canvas.width - 100);
            this.y = canvas.height + 50;
            this.size = isBomb ? 60 : 40 + Math.random() * 25;
            this.speedX = (Math.random() - 0.5) * (6 + level);
            this.speedY = -(14 + Math.random() * 6 + level);
            this.gravity = 0.3 + (level * 0.02);
            this.isBomb = isBomb;
            this.color = isBomb ? "#ff003c" : "#00ff41";
            this.rotation = 0;
            this.rotSpeed = (Math.random() - 0.5) * 0.25;
        }
        update() { this.x += this.speedX; this.speedY += this.gravity; this.y += this.speedY; this.rotation += this.rotSpeed; }
        draw() {
            ctx.save(); ctx.translate(this.x + this.size/2, this.y + this.size/2); ctx.rotate(this.rotation);
            ctx.shadowBlur = 15; ctx.shadowColor = this.color; ctx.strokeStyle = this.color; ctx.lineWidth = 3;
            ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
            if (this.isBomb) { ctx.fillStyle = "rgba(255,0,0,0.3)"; ctx.fill(); }
            ctx.restore();
        }
    }

    function handleInput(ex, ey) {
        if (!gameActive) return;
        trail.push({x: ex, y: ey, life: 1.0});

        let slicedThisFrame = 0;
        objects.forEach((obj, index) => {
            let dx = ex - (obj.x + obj.size/2);
            let dy = ey - (obj.y + obj.size/2);
            if (Math.abs(dx) < obj.size && Math.abs(dy) < obj.size) {
                shake = 8;
                for(let i=0; i<15; i++) particles.push(new Particle(obj.x + obj.size/2, obj.y + obj.size/2, obj.color));
                
                if (obj.isBomb) {
                    score = Math.max(0, score - 20);
                    texts.push(new FloatingText(obj.x, obj.y, "-20 BOMB!", "#ff003c"));
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                } else {
                    slicedThisFrame++;
                    score += 1;
                    exp += 5;
                    texts.push(new FloatingText(obj.x, obj.y, "+1", "#fff"));
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                }
                objects.splice(index, 1);
                updateUI();
            }
        });

        if (slicedThisFrame >= 2) {
            texts.push(new FloatingText(ex, ey - 40, "COMBO X" + slicedThisFrame, "#ffcc00"));
            score += slicedThisFrame;
            exp += slicedThisFrame * 2;
            updateUI();
        }
    }

    function updateUI() {
        if (exp >= 100) {
            level++;
            exp = 0;
            texts.push(new FloatingText(canvas.width/2 - 50, canvas.height/2, "LEVEL UP!", "#00ff41"));
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
        document.getElementById('score-val').innerText = score;
        document.getElementById('lvl-val').innerText = "LVL " + level;
        document.getElementById('progress-bar').style.width = exp + "%";
    }

    window.addEventListener('touchmove', (e) => handleInput(e.touches[0].clientX, e.touches[0].clientY));

    function gameLoop() {
        ctx.setTransform(1,0,0,1,0,0);
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (shake > 0) { ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2); shake *= 0.9; }

        if (gameActive) {
            if (trail.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 6;
                ctx.moveTo(trail[0].x, trail[0].y);
                for(let i=1; i<trail.length; i++) { ctx.lineTo(trail[i].x, trail[i].y); trail[i].life -= 0.12; }
                ctx.stroke(); trail = trail.filter(t => t.life > 0);
            }

            if (Math.random() < (0.05 + level * 0.01)) objects.push(new DataNode(Math.random() < 0.2));

            objects.forEach((obj, i) => { obj.update(); obj.draw(); if (obj.y > canvas.height + 100) objects.splice(i, 1); });
            particles.forEach((p, i) => { p.update(); p.draw(); if (p.life <= 0) particles.splice(i, 1); });
            texts.forEach((t, i) => { t.update(); t.draw(); if (t.life <= 0) texts.splice(i, 1); });
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
