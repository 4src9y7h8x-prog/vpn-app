<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private IT Node // SLICE ZONE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #010a01; color: #00ff41; font-family: monospace; overflow: hidden; height: 100vh; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 5; }
        #ui { position: relative; z-index: 10; text-align: center; padding: 15px; background: rgba(0,0,0,0.8); border-bottom: 2px solid #00ff41; pointer-events: none; }
        #score-val { font-size: 36px; color: #fff; text-shadow: 0 0 15px #00ff41; }
        #start-prompt { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; text-align: center; font-size: 18px; background: rgba(0,0,0,0.9);
            padding: 20px; border: 1px solid #00ff41; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="start-prompt">🦾 НАЖМИ, ЧТОБЫ ЗАПУСТИТЬ УЗЛЫ</div>
    
    <div id="ui">
        <div style="letter-spacing: 2px;">FIREWALL SLICER // CORE</div>
        <div id="score-val">0</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <!-- Музыка (назови файл music.mp3 на гитхабе) -->
    <audio id="bgMusic" src="music.mp3" loop></audio>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('bgMusic');
    const startPrompt = document.getElementById('start-prompt');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let objects = [];
    let trail = []; 
    let gameActive = false;

    // Запуск игры по клику (нужно для музыки и звука)
    startPrompt.addEventListener('click', () => {
        gameActive = true;
        startPrompt.style.display = 'none';
        music.play().catch(() => console.log("Музыка не найдена, играем без неё"));
        if (window.AudioContext || window.webkitAudioContext) {
            audioCtx.resume();
        }
    });

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSliceSound() {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    class DataNode {
        constructor() {
            this.x = 50 + Math.random() * (canvas.width - 100);
            this.y = canvas.height + 50;
            this.size = 40 + Math.random() * 20;
            this.speedX = (Math.random() - 0.5) * 6;
            this.speedY = - (14 + Math.random() * 6); // Сила вылета
            this.gravity = 0.3;
            this.isSliced = false;
            this.rotation = 0;
            this.rotSpeed = (Math.random() - 0.5) * 0.1;
        }
        update() {
            this.x += this.speedX;
            this.speedY += this.gravity;
            this.y += this.speedY;
            this.rotation += this.rotSpeed;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x + this.size/2, this.y + this.size/2);
            ctx.rotate(this.rotation);
            ctx.shadowBlur = 15; ctx.shadowColor = "#00ff41";
            ctx.strokeStyle = "#00ff41"; ctx.lineWidth = 3;
            
            if (!this.isSliced) {
                ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
            } else {
                // Две половинки при разрезе
                ctx.beginPath(); ctx.moveTo(-this.size, 0); ctx.lineTo(this.size, 0); ctx.stroke();
            }
            ctx.restore();
        }
    }

    function handleInput(ex, ey) {
        if (!gameActive) return;
        trail.push({x: ex, y: ey, life: 1.0});

        objects.forEach(obj => {
            let dx = ex - (obj.x + obj.size/2);
            let dy = ey - (obj.y + obj.size/2);
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (!obj.isSliced && dist < obj.size) {
                obj.isSliced = true;
                score++;
                document.getElementById('score-val').innerText = score;
                playSliceSound();
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        });
    }

    window.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        handleInput(touch.clientX, touch.clientY);
    });

    function gameLoop() {
        ctx.fillStyle = "rgba(1, 10, 1, 0.4)"; // Эффект шлейфа
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (gameActive) {
            // Отрисовка следа свайпа
            if (trail.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 5; ctx.lineCap = "round";
                ctx.moveTo(trail[0].x, trail[0].y);
                for(let i=1; i<trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                    trail[i].life -= 0.1;
                }
                ctx.stroke();
                trail = trail.filter(t => t.life > 0);
            }

            // Частота появления (бананов) узлов
            if (Math.random() < 0.05) objects.push(new DataNode());

            objects.forEach((obj, index) => {
                obj.update();
                obj.draw();
                if (obj.y > canvas.height + 150) objects.splice(index, 1);
            });
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
