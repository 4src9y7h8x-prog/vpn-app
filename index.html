<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private IT Node // ZONE 2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #020502; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; opacity: 0.4; }
        
        #ui { position: relative; z-index: 10; text-align: center; padding: 15px; background: rgba(0,0,0,0.9); border-bottom: 2px solid #00ff41; }
        
        /* Лидерборд как на картинке */
        #leaderboard {
            margin: 10px auto; width: 90%; background: rgba(0, 40, 0, 0.3);
            border: 1px solid #00ff41; border-radius: 10px; padding: 10px;
            font-size: 12px; text-align: left; box-shadow: inset 0 0 10px #00ff41;
        }
        .leader-item { display: flex; justify-content: space-between; margin: 3px 0; border-bottom: 1px hideen rgba(0,255,65,0.1); }
        .gold { color: #ffd700; font-weight: bold; }

        .node-container { position: relative; width: 100%; height: 50vh; display: flex; align-items: center; justify-content: center; }
        .node { 
            width: 100px; height: 100px; z-index: 20; touch-action: none;
            display: flex; align-items: center; justify-content: center;
            filter: drop-shadow(0 0 15px #00ff41);
        }
        
        /* Сложные фигуры из промпта */
        .shape-0 { border-radius: 50%; border: 4px double #00ff41; }
        .shape-1 { clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); border: 2px solid #00ff41; }
        .shape-2 { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: rgba(0,255,65,0.2); }

        .scan-line {
            position: absolute; width: 100%; height: 1px; background: #00ff41;
            box-shadow: 0 0 8px #00ff41; z-index: 5; animation: scan 3s linear infinite;
        }
        @keyframes scan { from { top: 0%; } to { top: 100%; } }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <canvas id="matrix"></canvas>

    <div id="ui">
        <div style="letter-spacing: 2px; font-size: 14px;">PRIVATE IT NODE // ZONE</div>
        <div style="font-size: 24px; color: #fff; margin: 5px 0;">[ <span id="score">0</span> ] NODES CAPTURED</div>
        
        <div id="leaderboard">
            <div style="text-align: center; border-bottom: 1px solid #00ff41; margin-bottom: 5px;">CAPTURE LEADERBOARD (TOP 3)</div>
            <div class="leader-item gold"><span>👑 @DPI_REBEL</span> <span>4,310</span></div>
            <div class="leader-item"><span>🥈 @UAE_CYBER</span> <span>3,980</span></div>
            <div class="leader-item"><span>🥉 @PROXY_KNGT</span> <span>3,150</span></div>
        </div>
    </div>

    <div class="node-container">
        <div id="node" class="node shape-0"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const scoreEl = document.getElementById('score');
        const node = document.getElementById('node');
        let score = 0;

        // Звуковой движок
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playEffect() {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.frequency.setValueAtTime(500 + Math.random()*300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function updateNode() {
            node.className = 'node shape-' + Math.floor(Math.random() * 3);
            const color = score > 100 ? '#ff0044' : '#00ff41'; // Краснеет при нагрузке
            node.style.boxShadow = `0 0 30px ${color}`;
            node.style.borderColor = color;
        }

        node.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            score++;
            scoreEl.innerText = score;
            playEffect();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            updateNode();

            // Каждые 10 тапов отправляем данные боту (фоново)
            if (score % 10 === 0) {
                tg.CloudStorage.setItem('user_score', score.toString());
            }
        });

        // Кнопка закрытия передает финальный результат
        tg.MainButton.text = "СОХРАНИТЬ РЕЗУЛЬТАТ";
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            tg.sendData(JSON.stringify({action: "update_score", points: score}));
            tg.close();
        });
    </script>
</body>
</html>
