<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIVATE IT NODE // GLITCH SLICER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; touch-action: none; -webkit-user-select: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 5; filter: contrast(1.2) brightness(1.1); }
        
        #ui { position: relative; z-index: 10; text-align: center; padding: 15px; border-bottom: 2px solid #00ff41; background: rgba(0,0,0,0.9); pointer-events: none; }
        #score-val { font-size: 48px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41; }
        
        #start-prompt { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; text-align: center; background: #00ff41; color: #000;
            padding: 20px 40px; font-weight: bold; font-size: 20px; cursor: pointer;
            box-shadow: 0 0 30px #00ff41; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        /* Эффект помех на фоне */
        .scanline {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 20;
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div id="start-prompt">ЗАПУСТИТЬ ПРОТОКОЛ</div>
    
    <div id="ui">
        <div style="letter-spacing: 5px; font-size: 12px; opacity: 0.8;">NODE_SLICER_V4.LITE</div>
        <div id="score-val">0</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    <audio id="bgMusic" src="music.mp3" loop></audio>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startPrompt = document.getElementById('start-prompt');
    const music = document.getElementById('bgMusic');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let objects = [];
    let particles = [];
    let trail = [];
    let gameActive = false;
    let shake = 0;

    startPrompt.addEventListener('click', () => {
        gameActive = true;
        startPrompt.style.display = 'none';
        music.play().catch(() => {});
    });

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.size = Math.random() * 5 + 2;
            this.speedX = (Math.random() - 0.5) * 15;
            this.speedY = (Math.random() - 0.5) * 15;
            this.life = 1.0;
            this.color = color;
        }
        update() { this.x += this.speedX; this.y += this.speedY; this.life -= 0.03; }
        draw() {
            ctx.fillStyle = this.color; ctx.globalAlpha = this.life;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    class DataNode {
        constructor(isBomb = false) {
            this.x = 50 + Math.random() * (canvas.width - 100);
            this.y = canvas.height + 50;
            this.size = isBomb ? 60 : 40 + Math.random() * 30;
            this.speedX = (Math.random() - 0.5) * 8;
            this.speedY = -(16 + Math.random() * 8);
            this.gravity = 0.35;
            this.isBomb = isBomb;
            this.color = isBomb ? "#ff003c" : "#00ff41";
            this.rotation = 0;
            this.rotSpeed = (Math.random() - 0.5) * 0.3;
            this.history = []; // Для шлейфа объекта
        }
        update() {
            this.history.push({x: this.x, y: this.y, r: this.rotation});
            if (this.history.length > 5) this.history.shift();
            this.x += this.speedX; this.speedY += this.gravity; this.y += this.speedY; this.rotation += this.rotSpeed;
        }
        draw() {
            // Рисуем шлейф (Ghosting)
            this.history.forEach((h, i) => {
                ctx.save(); ctx.globalAlpha = i * 0.1; ctx.translate(h.x + this.size/2, h.y + this.size/2); ctx.rotate(h.r);
                ctx.strokeStyle = this.color; ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size); ctx.restore();
            });
            // Основной объект
            ctx.save(); ctx.translate(this.x + this.size/2, this.y + this.size/2); ctx.rotate(this.rotation);
            ctx.shadowBlur = 20; ctx.shadowColor = this.color; ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
            ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
            ctx.strokeStyle = this.color; ctx.lineWidth = 2;
            ctx.strokeRect(-this.size/2 - 5, -this.size/2 - 5, this.size + 10, this.size + 10);
            ctx.restore();
        }
    }

    function handleInput(ex, ey) {
        if (!gameActive) return;
        trail.push({x: ex, y: ey, life: 1.0});

        objects.forEach((obj, index) => {
            let dx = ex - (obj.x + obj.size/2);
            let dy = ey - (obj.y + obj.size/2);
            if (Math.abs(dx) < obj.size && Math.abs(dy) < obj.size) {
                shake = 10; // Тряска при попадании
                for(let i=0; i<20; i++) particles.push(new Particle(obj.x + obj.size/2, obj.y + obj.size/2, obj.color));
                
                if (obj.isBomb) {
                    score = Math.max(0, score - 20);
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                } else {
                    score++;
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
                }
                document.getElementById('score-val').innerText = score;
                objects.splice(index, 1);
            }
        });
    }

    window.addEventListener('touchmove', (e) => handleInput(e.touches[0].clientX, e.touches[0].clientY));

    function gameLoop() {
        ctx.setTransform(1,0,0,1,0,0);
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (shake > 0) {
            ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2);
            shake *= 0.9;
        }

        if (gameActive) {
            // Агрессивный след свайпа
            if (trail.length > 1) {
                ctx.shadowBlur = 25; ctx.shadowColor = "#00ff41";
                ctx.beginPath(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 8;
                ctx.moveTo(trail[0].x, trail[0].y);
                for(let i=1; i<trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                    trail[i].life -= 0.15;
                }
                ctx.stroke();
                trail = trail.filter(t => t.life > 0);
            }

            if (Math.random() < 0.08) objects.push(new DataNode(Math.random() < 0.2));

            objects.forEach((obj, i) => { obj.update(); obj.draw(); if (obj.y > canvas.height + 100) objects.splice(i, 1); });
            particles.forEach((p, i) => { p.update(); p.draw(); if (p.life <= 0) particles.splice(i, 1); });
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
